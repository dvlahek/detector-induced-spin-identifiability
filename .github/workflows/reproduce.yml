name: Reproduce publication checkpoints

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analysis dependencies
        run: python -m pip install --quiet -r requirements.txt

      - name: Verify static nuisance-domain sensitivity
        run: |
          python theory_numerics/nuisance_domain_sensitivity.py
          python - <<'PY'
          import pandas as pd
          p = 'theory_numerics/results/nuisance_domain_sensitivity.csv'
          d = pd.read_csv(p).set_index('K')
          assert int(d.loc['{2}', 'tau_protected']) == 1
          assert int(d.loc['[0.5,3.5]', 'tau_protected']) == 1
          assert int(d.loc['[0,4]', 'tau_protected']) == 2
          assert int(d.loc['[-4,4]', 'tau_protected']) == 2
          assert abs(float(d.loc['[0,4]', 'combined_margin']) - 0.5378414486981995) < 1e-12
          print('nuisance_domain_checkpoints_ok')
          PY

      - name: Verify legacy finite-bandwidth archive
        run: |
          python theory_numerics/verify_publication_tables.py
          python theory_numerics/plot_status_map.py

      - name: Reproduce PRD v1.4 finite-bandwidth classification
        run: |
          python theory_numerics/finite_bandwidth_prd_v1_4.py \
            --old-status theory_numerics/results/S1_slope_bandwidth_certificates_monotone_v1_1.csv \
            --outdir reproduced_results/prd_v1_4 \
            --unresolved-overlap-starts 1024
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('reproduced_results/prd_v1_4/finite_bandwidth_prd_v1_4_summary.json')
          d = json.loads(p.read_text())
          assert d['status_counts'] == {
              'guaranteed': 64,
              'explicit_overlap': 33,
              'unresolved': 2,
          }
          assert d['unresolved_points'] == [
              {'sigma_k_over_m': 0.08, 'L': 24.0},
              {'sigma_k_over_m': 0.1, 'L': 16.0},
          ]
          assert d['explicit_overlap']['target_value_t1'] < 0.0
          assert all(not x['negative_profile_found']
                     for x in d['unresolved_32segment_search'])
          print('prd_v1_4_finite_bandwidth_checkpoints_ok')
          PY

      - name: Decode lossless public sufficient statistics
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          src = Path('collider/sufficient_statistics_v2.json.gz.b64').read_text().strip()
          raw = gzip.decompress(base64.b64decode(src))
          Path('collider/sufficient_statistics_v2_decoded.json').write_bytes(raw)
          PY

      - name: Reproduce public collider checkpoints
        run: |
          python collider/scripts/reproduce_public_statistics.py \
            --statistics collider/sufficient_statistics_v2_decoded.json \
            --archived-closure collider/results/fermion_vector_kl_validation_summary.json \
            --archived-resource collider/results/architecture_kl_summary.csv \
            --output reproduced_results/public_statistics.json

      - name: Syntax-check full event-level analysis scripts
        run: |
          python -m py_compile collider/scripts/validate_fermion_vector_kl.py
          python -m py_compile collider/scripts/resource_degradation_analysis.py

      - name: Upload reproduced outputs
        uses: actions/upload-artifact@v4
        with:
          name: reproduced-publication-checkpoints
          path: |
            reproduced_results/
            theory_numerics/figures/S1_status_map_reproduced.png
            theory_numerics/figures/nuisance_domain_sensitivity.png
            theory_numerics/results/nuisance_domain_sensitivity.csv
          retention-days: 30
