name: Reproduce publication checkpoints

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned analysis dependencies
        run: python -m pip install --quiet -r requirements.txt

      - name: Verify finite-bandwidth archived tables
        run: |
          python theory_numerics/verify_publication_tables.py
          python theory_numerics/plot_status_map.py

      - name: Recompute collider KL validation
        run: |
          python collider/scripts/validate_fermion_vector_kl.py \
            --reference collider/frozen_data/reco_reference_100k.npz \
            --outdir reproduced_results/closure \
            --binnings 6 8 10 12 \
            --replicates 300 \
            --bootstrap-replicates 500 \
            --classifier-max-per-class 100000 \
            --seed 20260825

      - name: Recompute frozen readout degradation
        run: |
          python collider/scripts/resource_degradation_analysis.py \
            --reference collider/frozen_data/reco_reference_100k.npz \
            --outdir reproduced_results/resource \
            --seed 20260817 \
            --bins 12 \
            --pseudo 0.5 \
            --bias-reps 500 \
            --bootstrap-reps 1000 \
            --mc-trials 50000

      - name: Validate publication checkpoints
        run: |
          python - <<'PY'
          import json
          import pandas as pd

          s = json.load(open('reproduced_results/closure/fermion_vector_kl_validation_summary.json'))
          t = s['target']
          assert abs(t['raw_full_D_min'] - 0.1559913221919423) < 1e-12
          assert abs(t['bias_corrected_full_D_min'] - 0.1488976546638089) < 1e-10
          assert abs(t['bias_corrected_D_min_ci025'] - 0.1447812962754047) < 1e-10
          assert abs(t['bias_corrected_D_min_ci975'] - 0.15291247510327222) < 1e-10

          a = pd.read_csv('reproduced_results/resource/architecture_kl_summary.csv').set_index('architecture')
          assert abs(a.loc['direction_pair_2D','raw_D_min'] - 0.0062287072843407315) < 1e-12
          assert 0.0045 < a.loc['direction_pair_2D','bias_corrected_D_min'] < 0.0049
          assert 0.160 < a.loc['full_spectrometric_3D','bias_corrected_D_min'] < 0.163

          b = json.load(open('reproduced_results/resource/barrel_direction_highstat_verification.json'))
          assert b['physical_point_estimate_after_nonnegative_boundary'] == 0.0
          assert 0.0 < b['recentered_bootstrap_ci95_high'] < 0.003
          print('all_publication_checkpoints_ok')
          PY

      - name: Upload reproduced outputs
        uses: actions/upload-artifact@v4
        with:
          name: reproduced-publication-checkpoints
          path: reproduced_results/
          retention-days: 30
