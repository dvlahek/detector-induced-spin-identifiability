name: Reproduce publication 1.0 checkpoints

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analysis dependencies
        run: python -m pip install --quiet -r requirements.txt

      - name: Verify archived publication tables
        run: python theory_numerics/verify_publication_tables.py

      - name: Verify static nuisance-domain sensitivity
        run: |
          python theory_numerics/nuisance_domain_sensitivity.py
          python - <<'PY'
          import pandas as pd
          p = 'theory_numerics/results/nuisance_domain_sensitivity.csv'
          d = pd.read_csv(p).set_index('K')
          assert int(d.loc['{2}', 'tau_protected']) == 1
          assert int(d.loc['[0.5,3.5]', 'tau_protected']) == 1
          assert int(d.loc['[0,4]', 'tau_protected']) == 2
          assert int(d.loc['[-4,4]', 'tau_protected']) == 2
          assert abs(float(d.loc['[0,4]', 'combined_margin']) - 0.5378414486981995) < 1e-12
          print('nuisance_domain_checkpoints_ok')
          PY

      - name: Reproduce finite-bandwidth classification
        run: |
          python theory_numerics/finite_bandwidth.py \
            --old-status theory_numerics/results/S1_slope_bandwidth_certificates_monotone_v1_1.csv \
            --outdir reproduced_results/publication_v1_0 \
            --unresolved-overlap-starts 1024

      - name: Reproduce measures and distance enclosure
        run: |
          python theory_numerics/detector_measures_distance.py \
            --outdir reproduced_results/publication_v1_0 \
            --figdir reproduced_results/figures
          python theory_numerics/verify_publication_tables.py \
            --data reproduced_results/publication_v1_0

      - name: Reproduce estimator-space recovery audit
        run: |
          python theory_numerics/precision_recovery.py \
            --output reproduced_results/S3_precision_based_recovery.csv
          python - <<'PY'
          import numpy as np
          import pandas as pd
          expected = pd.read_csv('theory_numerics/results/S3_precision_based_recovery.csv')
          actual = pd.read_csv('reproduced_results/S3_precision_based_recovery.csv')
          assert list(actual.columns) == list(expected.columns)
          assert np.allclose(actual.to_numpy(), expected.to_numpy(), rtol=0, atol=1e-12)
          print('precision_recovery_checkpoints_ok')
          PY

      - name: Decode lossless public sufficient statistics
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          src = Path('collider/sufficient_statistics_v2.json.gz.b64').read_text().strip()
          raw = gzip.decompress(base64.b64decode(src))
          Path('collider/sufficient_statistics_v2_decoded.json').write_bytes(raw)
          PY

      - name: Reproduce public collider checkpoints
        run: |
          python collider/scripts/reproduce_public_statistics.py \
            --statistics collider/sufficient_statistics_v2_decoded.json \
            --archived-closure collider/results/fermion_vector_kl_validation_summary.json \
            --archived-resource collider/results/architecture_kl_summary.csv \
            --output reproduced_results/public_statistics.json

      - name: Syntax-check event-level analyses
        run: |
          python -m py_compile collider/scripts/validate_fermion_vector_kl.py
          python -m py_compile collider/scripts/resource_degradation_analysis.py

      - name: Upload reproduced outputs
        uses: actions/upload-artifact@v4
        with:
          name: publication-v1.0-reproduced-checkpoints
          path: reproduced_results/
          retention-days: 30
