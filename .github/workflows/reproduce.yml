name: Reproduce spin-identifiability numerical evidence

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: python -m pip install -r requirements.txt
      - name: Recompute unfiltered whole-class results and witnesses
        run: python theory_numerics/spin_alpha0_compute.py
      - name: Recompute 21 QCQP minima and SOS checks
        run: python theory_numerics/spin_alpha0_qcqp.py
      - name: Recompute seeded estimator-space power
        run: python theory_numerics/spin_alpha0_power.py
      - name: Rebuild numerical figures
        run: python theory_numerics/spin_alpha0_figures.py
      - name: Check frozen code/data regression targets
        run: python theory_numerics/verify_alpha0_release.py
      - name: Independent magnetic-only margin audit
        run: |
          python theory_numerics/narrow_prior_magnetic_audit.py --output reproduced_results/narrow_prior_magnetic_margins.csv
          python - <<'PY'
          import numpy as np, pandas as pd
          old=pd.read_csv('theory_numerics/results/narrow_prior_magnetic_margins.csv')
          new=pd.read_csv('reproduced_results/narrow_prior_magnetic_margins.csv')
          assert len(old)==len(new)==99
          assert old.columns.tolist()==new.columns.tolist()
          assert np.allclose(old.to_numpy(),new.to_numpy(),rtol=1e-9,atol=1e-11)
          print('PASS magnetic-only 99-grid margins')
          PY
      - name: Independent frozen-profile and citation-snapshot smoke tests
        run: python reproduce.py --mode smoke
      - name: Upload regenerated numerical results
        uses: actions/upload-artifact@v4
        with:
          name: spin-jphysa-alpha0-results
          path: theory_numerics/reproduced_alpha0/
          retention-days: 30
