name: Create publication 1.0 release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate publication version
        run: test "$(tr -d '[:space:]' < VERSION)" = "1.0.0"

      - name: Create immutable publication release if absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="publication-v1.0.0"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag already exists; leaving it unchanged."
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Publication 1.0" \
              --notes-file RELEASE_NOTES.md
          fi
