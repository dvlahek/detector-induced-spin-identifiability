name: Create v1.4.0 publication release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'dvlahek/detector-induced-spin-identifiability'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate release version
        run: test "$(tr -d '[:space:]' < VERSION)" = "1.4.0"

      - name: Create fixed GitHub release if absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.4.0 >/dev/null 2>&1; then
            echo "Release v1.4.0 already exists."
          else
            gh release create v1.4.0 \
              --target "${GITHUB_SHA}" \
              --title "PRD reproducibility snapshot v1.4.0" \
              --notes-file RELEASE_NOTES_v1.4.0.md
          fi
